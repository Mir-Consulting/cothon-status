owner: Mir-Consulting
repo: cothon-status

# Checked every 5 minutes by GitHub Actions. A non-2xx response opens a
# GitHub issue (the incident record) and closes it when the check recovers.
sites:
  - name: Web app
    url: https://www.cothon.ca
  - name: API
    url: https://projectpm-production.up.railway.app/readyz
  - name: Background processing
    url: https://projectpm-production.up.railway.app/readyz/background
  - name: Sign-in
    url: https://api.cothon.ca/auth/v1/health
    headers:
      - "apikey: $SUPABASE_ANON_KEY"

status-website:
  cname: status.cothon.ca
  name: Cothon Status
  introTitle: "Cothon system status"
  introMessage: "Live availability of the Cothon platform, checked every 5 minutes. Past incidents and uptime history are listed below."
  navbar:
    - title: Status
      href: /
    - title: Trust Center
      href: https://www.cothon.ca/trust

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  staticSite: "0 1 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"

skipDescriptionUpdate: true
skipTopicsUpdate: true
